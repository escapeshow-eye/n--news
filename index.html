<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>n: – Nachrichten</title>

<style>
:root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #111318;
    --muted: #737780;
    --border: #e3e5e8;
    --red: #e53935;
    --blue: #2563eb;
    --green: #16a34a;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    background: rgba(255,255,255,.94);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 37px;
    font-weight: 900;
    letter-spacing: -4px;
    cursor: pointer;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 43px;
    height: 43px;

    border: none;
    border-radius: 12px;

    background: transparent;

    cursor: pointer;

    font-size: 20px;
}

.icon-button:hover {
    background: #eef0f2;
}

/* =========================
   MAIN
========================= */

main {
    max-width: 1200px;
    margin: auto;
    padding: 45px 22px 80px;
}

/* =========================
   HERO
========================= */

.hero {
    margin-bottom: 30px;
}

.hero-small {
    color: var(--muted);

    font-size: 13px;
    font-weight: 800;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.hero h1 {
    margin: 8px 0;

    font-size: clamp(42px, 7vw, 72px);
    line-height: .95;

    letter-spacing: -4px;
}

.hero p {
    margin: 0;

    color: var(--muted);

    font-size: 18px;
}

/* =========================
   SEARCH
========================= */

.search-box {
    display: none;

    margin-bottom: 20px;
}

.search-box input {
    width: 100%;

    padding: 15px 18px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background: white;

    font-size: 16px;

    outline: none;
}

.search-box input:focus {
    border-color: #999;
}

/* =========================
   FILTER
========================= */

.filters {
    display: flex;
    gap: 8px;

    overflow-x: auto;

    padding: 5px 0 22px;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter {
    flex-shrink: 0;

    padding: 10px 16px;

    border-radius: 999px;

    border: 1px solid var(--border);

    background: white;

    cursor: pointer;

    font-weight: 700;
}

.filter:hover {
    border-color: #999;
}

.filter.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
}

/* =========================
   NEWS
========================= */

.news-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 18px;
}

.news-card {
    overflow: hidden;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 20px;

    cursor: pointer;

    transition: .18s;
}

.news-card:hover {
    transform: translateY(-3px);

    box-shadow: 0 12px 30px rgba(0,0,0,.07);
}

.news-image {
    height: 180px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg,#dfe3e8,#fafafa);

    color: #999;

    font-size: 34px;
    font-weight: 900;
}

.news-content {
    padding: 20px;
}

.news-meta {
    display: flex;
    gap: 7px;

    margin-bottom: 10px;

    color: var(--muted);

    font-size: 13px;
}

.news-category {
    font-weight: 800;
    color: var(--text);
}

.news-card h2 {
    margin: 0 0 10px;

    font-size: 22px;
    line-height: 1.15;
}

.news-card p {
    margin: 0;

    color: var(--muted);

    line-height: 1.5;
}

/* =========================
   BREAKING
========================= */

.breaking {
    grid-column: 1 / -1;

    padding: 24px;

    border-radius: 20px;

    background: white;

    border: 1px solid var(--border);
    border-left: 5px solid var(--red);

    cursor: pointer;
}

.breaking-label {
    color: var(--red);

    font-size: 12px;
    font-weight: 900;

    text-transform: uppercase;
    letter-spacing: 1px;

    margin-bottom: 8px;
}

.breaking h2 {
    margin: 0;

    font-size: clamp(26px,4vw,38px);
}

/* =========================
   ARTICLE
========================= */

.article {
    display: none;

    max-width: 850px;
    margin: auto;
}

.back {
    margin-bottom: 25px;

    padding: 10px 15px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: white;

    cursor: pointer;

    font-weight: 700;
}

.article-meta {
    color: var(--muted);

    margin-bottom: 12px;
}

.article h1 {
    margin: 0 0 25px;

    font-size: clamp(40px,7vw,70px);

    line-height: .98;

    letter-spacing: -4px;
}

.article-picture {
    height: 360px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 30px;

    border-radius: 22px;

    background: linear-gradient(135deg,#dfe3e8,#fafafa);

    color: #999;

    font-size: 40px;
    font-weight: 900;
}

.article-text {
    font-size: 18px;
    line-height: 1.8;
}

/* =========================
   ADMIN LOGIN
========================= */

.admin {
    display: none;

    max-width: 900px;
    margin: auto;
}

.admin-login {
    max-width: 430px;
    margin: 70px auto;
    padding: 30px;

    background: white;

    border: 1px solid var(--border);

    border-radius: 22px;
}

.admin-login h2 {
    margin-top: 0;
}

.admin-login input,
.admin-editor input,
.admin-editor textarea,
.admin-editor select {
    width: 100%;

    padding: 13px 14px;

    margin-top: 7px;
    margin-bottom: 17px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: white;

    font: inherit;

    outline: none;
}

.admin-login input:focus,
.admin-editor input:focus,
.admin-editor textarea:focus {
    border-color: #888;
}

.admin-button {
    padding: 12px 17px;

    border: none;

    border-radius: 12px;

    background: var(--text);

    color: white;

    cursor: pointer;

    font-weight: 800;
}

.admin-button:hover {
    opacity: .85;
}

.admin-error {
    color: var(--red);

    margin-top: 12px;

    font-size: 14px;
}

/* =========================
   ADMIN DASHBOARD
========================= */

.admin-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.admin-header h1 {
    margin: 0;
}

.logout {
    background: #eee;
    color: #111;
}

.admin-editor {
    padding: 25px;

    background: white;

    border: 1px solid var(--border);

    border-radius: 20px;

    margin-bottom: 25px;
}

.admin-editor textarea {
    min-height: 230px;

    resize: vertical;
}

.admin-editor button {
    margin-right: 8px;
}

.article-list {
    display: grid;
    gap: 10px;
}

.admin-item {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding: 17px;

    background: white;

    border: 1px solid var(--border);

    border-radius: 15px;
}

.admin-item-title {
    font-weight: 800;
}

.admin-item-actions {
    display: flex;
    gap: 7px;
}

.small-button {
    padding: 8px 11px;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    background: #eee;

    font-weight: 700;
}

.delete {
    background: #fee2e2;
    color: #b91c1c;
}

.edit {
    background: #e0e7ff;
    color: #3730a3;
}

/* =========================
   FOOTER
========================= */

footer {
    padding: 30px 20px;

    border-top: 1px solid var(--border);

    text-align: center;

    color: var(--muted);

    font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 850px) {

    .news-grid {
        grid-template-columns: repeat(2,1fr);
    }

}

@media (max-width: 600px) {

    header {
        padding: 0 17px;
    }

    main {
        padding: 32px 15px 60px;
    }

    .news-grid {
        grid-template-columns: 1fr;
    }

    .breaking {
        grid-column: auto;
    }

    .hero h1 {
        letter-spacing: -2px;
    }

    .article h1 {
        letter-spacing: -2px;
    }

    .article-picture {
        height: 230px;
    }

    .admin-item {
        align-items: flex-start;
        flex-direction: column;
    }

}
</style>
</head>


<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div
        class="logo"
        onclick="showHome()"
        title="Startseite"
    >
        n:
    </div>

    <div class="header-buttons">

        <button
            class="icon-button"
            onclick="toggleSearch()"
            title="Suche"
        >
            🔎
        </button>

        <button
            class="icon-button"
            onclick="openAdmin()"
            title="Redaktion"
        >
            🔐
        </button>

    </div>

</header>


<main>

<!-- =========================
     HOME
========================= -->

<section id="home">

    <div class="hero">

        <div class="hero-small">
            n: Nachrichten
        </div>

        <h1>
            Was gerade passiert.
        </h1>

        <p>
            Aktuelle Nachrichten. Einfach und direkt.
        </p>

    </div>


    <div
        class="search-box"
        id="searchBox"
    >

        <input
            id="searchInput"
            type="text"
            placeholder="Nachrichten durchsuchen..."
            oninput="searchNews()"
        >

    </div>


    <div class="filters">

        <button
            class="filter active"
            onclick="filterNews('Alle',this)"
        >
            Alle
        </button>

        <button
            class="filter"
            onclick="filterNews('Deutschland',this)"
        >
            🇩🇪 Deutschland
        </button>

        <button
            class="filter"
            onclick="filterNews('Welt',this)"
        >
            🌍 Welt
        </button>

        <button
            class="filter"
            onclick="filterNews('Region',this)"
        >
            📍 Region
        </button>

        <button
            class="filter"
            onclick="filterNews('Sport',this)"
        >
            ⚽ Sport
        </button>

        <button
            class="filter"
            onclick="filterNews('Digital',this)"
        >
            💻 Digital
        </button>

    </div>


    <div
        class="news-grid"
        id="newsGrid"
    ></div>

</section>


<!-- =========================
     ARTICLE
========================= -->

<section
    class="article"
    id="article"
>

    <button
        class="back"
        onclick="showHome()"
    >
        ← Zurück
    </button>

    <div
        class="article-meta"
        id="articleMeta"
    ></div>

    <h1
        id="articleTitle"
    ></h1>

    <div class="article-picture">
        n:
    </div>

    <div
        class="article-text"
        id="articleText"
    ></div>

</section>


<!-- =========================
     ADMIN
========================= -->

<section
    class="admin"
    id="admin"
>

    <!-- LOGIN -->

    <div
        class="admin-login"
        id="adminLogin"
    >

        <h2>
            🔐 Redaktion
        </h2>

        <p>
            Nur für die Redaktion von n:
        </p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Passwort"
            onkeydown="if(event.key==='Enter') login()"
        >

        <button
            class="admin-button"
            onclick="login()"
        >
            Einloggen
        </button>

        <div
            class="admin-error"
            id="loginError"
        ></div>

    </div>


    <!-- DASHBOARD -->

    <div
        id="adminDashboard"
        style="display:none"
    >

        <div class="admin-header">

            <h1>
                Redaktion
            </h1>

            <button
                class="admin-button logout"
                onclick="logout()"
            >
                Ausloggen
            </button>

        </div>


        <!-- EDITOR -->

        <div class="admin-editor">

            <h2 id="editorHeading">
                Neuer Artikel
            </h2>


            <label>
                Überschrift
            </label>

            <input
                id="titleInput"
                type="text"
                placeholder="Überschrift des Artikels"
            >


            <label>
                Kurzbeschreibung
            </label>

            <input
                id="descriptionInput"
                type="text"
                placeholder="Kurze Beschreibung"
            >


            <label>
                Kategorie
            </label>

            <select id="categoryInput">

                <option>
                    Deutschland
                </option>

                <option>
                    Welt
                </option>

                <option>
                    Region
                </option>

                <option>
                    Sport
                </option>

                <option>
                    Digital
                </option>

            </select>


            <label>
                Region
            </label>

            <input
                id="regionInput"
                type="text"
                placeholder="z. B. Hessen"
            >


            <label>
                Artikeltext
            </label>

            <textarea
                id="textInput"
                placeholder="Schreibe hier deinen vollständigen Artikel..."
            ></textarea>


            <button
                class="admin-button"
                onclick="saveArticle()"
            >
                📰 Veröffentlichen
            </button>

            <button
                class="admin-button"
                onclick="clearEditor()"
                style="background:#eee;color:#111"
            >
                Abbrechen
            </button>

        </div>


        <!-- ARTICLE LIST -->

        <h2>
            Deine Artikel
        </h2>

        <div
            class="article-list"
            id="adminArticleList"
        ></div>

    </div>

</section>

</main>


<footer>

    © 2026 n: · Nachrichten

</footer>


<script>

/* =========================================================
   🔐 PASSWORT

   HIER KANNST DU DAS PASSWORT ÄNDERN.
========================================================= */

const ADMIN_PASSWORD = "nnews2026";


/* =========================================================
   ARTIKEL AUS LOCAL STORAGE LADEN
========================================================= */

let news = JSON.parse(
    localStorage.getItem("nNewsArticles")
) || [

    {
        id: 1,

        title:
            "Willkommen bei n:",

        description:
            "Das ist die erste Nachricht auf unserer neuen Newsseite.",

        category:
            "Deutschland",

        region:
            "Deutschland",

        date:
            "Heute · 10:32",

        text:
            "Willkommen bei n:. Hier entsteht eine moderne, einfache und übersichtliche Nachrichtenplattform. Diese Nachricht ist zunächst ein Beispielartikel."
    },

    {
        id: 2,

        title:
            "Was heute weltweit wichtig ist",

        description:
            "Ein Überblick über aktuelle Ereignisse aus aller Welt.",

        category:
            "Welt",

        region:
            "Welt",

        date:
            "Heute · 09:45",

        text:
            "Hier steht der vollständige Artikeltext. Später kannst du solche Artikel selbst über den Redaktionsbereich erstellen."
    },

    {
        id: 3,

        title:
            "Neue Entwicklungen im digitalen Bereich",

        description:
            "Technik und digitale Themen kompakt zusammengefasst.",

        category:
            "Digital",

        region:
            "Deutschland",

        date:
            "Heute · 08:21",

        text:
            "Hier steht ein Beispielartikel über digitale Entwicklungen."
    }

];


let currentCategory = "Alle";

let editingId = null;


/* =========================================================
   SPEICHERN
========================================================= */

function saveNews() {

    localStorage.setItem(
        "nNewsArticles",
        JSON.stringify(news)
    );

}


/* =========================================================
   NEWS ANZEIGEN
========================================================= */

function renderNews(list = news) {

    const grid =
        document.getElementById("newsGrid");

    grid.innerHTML = "";


    if (list.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                Keine Nachrichten gefunden.
            </div>
        `;

        return;
    }


    /* AKTUELL */

    if (
        currentCategory === "Alle" &&
        list.length > 0
    ) {

        const first = list[0];

        const breaking =
            document.createElement("div");

        breaking.className = "breaking";

        breaking.onclick =
            () => openArticle(first.id);

        breaking.innerHTML = `

            <div class="breaking-label">
                ● Aktuell
            </div>

            <h2>
                ${escapeHTML(first.title)}
            </h2>

        `;

        grid.appendChild(breaking);

    }


    /* KARTEN */

    list.forEach((item,index) => {

        if (
            currentCategory === "Alle" &&
            index === 0
        ) {
            return;
        }


        const card =
            document.createElement("article");

        card.className = "news-card";

        card.onclick =
            () => openArticle(item.id);


        card.innerHTML = `

            <div class="news-image">
                n:
            </div>

            <div class="news-content">

                <div class="news-meta">

                    <span class="news-category">
                        ${escapeHTML(item.category)}
                    </span>

                    ·

                    <span>
                        ${escapeHTML(item.date)}
                    </span>

                </div>

                <h2>
                    ${escapeHTML(item.title)}
                </h2>

                <p>
                    ${escapeHTML(item.description)}
                </p>

            </div>

        `;

        grid.appendChild(card);

    });

}


/* =========================================================
   FILTER
========================================================= */

function filterNews(category,button) {

    currentCategory = category;


    document
        .querySelectorAll(".filter")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    if (category === "Alle") {

        renderNews(news);

        return;
    }


    const filtered =
        news.filter(item =>
            item.category === category ||
            item.region === category
        );


    renderNews(filtered);

}


/* =========================================================
   SUCHE
========================================================= */

function toggleSearch() {

    const box =
        document.getElementById("searchBox");


    if (box.style.display === "block") {

        box.style.display = "none";

    } else {

        box.style.display = "block";

        document
            .getElementById("searchInput")
            .focus();

    }

}


function searchNews() {

    const value =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    const results =
        news.filter(item =>

            item.title
                .toLowerCase()
                .includes(value)

            ||

            item.description
                .toLowerCase()
                .includes(value)

            ||

            item.category
                .toLowerCase()
                .includes(value)

            ||

            item.region
                .toLowerCase()
                .includes(value)

        );


    renderNews(results);

}


/* =========================================================
   ARTIKEL ÖFFNEN
========================================================= */

function openArticle(id) {

    const item =
        news.find(article =>
            article.id === id
        );


    if (!item) return;


    document
        .getElementById("home")
        .style.display = "none";


    document
        .getElementById("admin")
        .style.display = "none";


    document
        .getElementById("article")
        .style.display = "block";


    document
        .getElementById("articleMeta")
        .textContent =
            `${item.category} · ${item.region} · ${item.date}`;


    document
        .getElementById("articleTitle")
        .textContent =
            item.title;


    document
        .getElementById("articleText")
        .innerHTML =
            escapeHTML(item.text)
                .replace(/\n/g,"<br><br>");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   HOME
========================================================= */

function showHome() {

    document
        .getElementById("article")
        .style.display = "none";


    document
        .getElementById("admin")
        .style.display = "none";


    document
        .getElementById("home")
        .style.display = "block";


    renderNews(news);


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   ADMIN ÖFFNEN
========================================================= */

function openAdmin() {

    document
        .getElementById("home")
        .style.display = "none";


    document
        .getElementById("article")
        .style.display = "none";


    document
        .getElementById("admin")
        .style.display = "block";


    const loggedIn =
        sessionStorage.getItem("nAdminLoggedIn");


    if (loggedIn === "true") {

        showDashboard();

    } else {

        document
            .getElementById("adminLogin")
            .style.display = "block";

        document
            .getElementById("adminDashboard")
            .style.display = "none";

    }


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   LOGIN
========================================================= */

function login() {

    const password =
        document
        .getElementById("passwordInput")
        .value;


    if (password === ADMIN_PASSWORD) {

        sessionStorage.setItem(
            "nAdminLoggedIn",
            "true"
        );


        document
            .getElementById("loginError")
            .textContent = "";


        document
            .getElementById("passwordInput")
            .value = "";


        showDashboard();

    } else {

        document
            .getElementById("loginError")
            .textContent =
                "❌ Falsches Passwort.";

    }

}


/* =========================================================
   DASHBOARD
========================================================= */

function showDashboard() {

    document
        .getElementById("adminLogin")
        .style.display = "none";


    document
        .getElementById("adminDashboard")
        .style.display = "block";


    renderAdminArticles();

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    sessionStorage.removeItem(
        "nAdminLoggedIn"
    );


    clearEditor();


    document
        .getElementById("adminDashboard")
        .style.display = "none";


    document
        .getElementById("adminLogin")
        .style.display = "block";

}


/* =========================================================
   ARTIKEL SPEICHERN
========================================================= */

function saveArticle() {

    const title =
        document
        .getElementById("titleInput")
        .value
        .trim();


    const description =
        document
        .getElementById("descriptionInput")
        .value
        .trim();


    const category =
        document
        .getElementById("categoryInput")
        .value;


    const region =
        document
        .getElementById("regionInput")
        .value
        .trim();


    const text =
        document
        .getElementById("textInput")
        .value
        .trim();


    if (
        !title ||
        !description ||
        !region ||
        !text
    ) {

        alert(
            "Bitte fülle alle Felder aus."
        );

        return;
    }


    if (editingId !== null) {

        const article =
            news.find(item =>
                item.id === editingId
            );


        if (article) {

            article.title =
                title;

            article.description =
                description;

            article.category =
                category;

            article.region =
                region;

            article.text =
                text;

        }

    } else {

        news.unshift({

            id:
                Date.now(),

            title:
                title,

            description:
                description,

            category:
                category,

            region:
                region,

            date:
                "Heute · " +
                new Date().toLocaleTimeString(
                    "de-DE",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                ),

            text:
                text

        });

    }


    saveNews();


    clearEditor();


    renderAdminArticles();


    alert(
        editingId === null
            ? "Artikel veröffentlicht!"
            : "Artikel aktualisiert!"
    );

}


/* =========================================================
   ARTIKEL BEARBEITEN
========================================================= */

function editArticle(id) {

    const article =
        news.find(item =>
            item.id === id
        );


    if (!article) return;


    editingId = id;


    document
        .getElementById("editorHeading")
        .textContent =
            "Artikel bearbeiten";


    document
        .getElementById("titleInput")
        .value =
            article.title;


    document
        .getElementById("descriptionInput")
        .value =
            article.description;


    document
        .getElementById("categoryInput")
        .value =
            article.category;


    document
        .getElementById("regionInput")
        .value =
            article.region;


    document
        .getElementById("textInput")
        .value =
            article.text;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   ARTIKEL LÖSCHEN
========================================================= */

function deleteArticle(id) {

    const article =
        news.find(item =>
            item.id === id
        );


    if (!article) return;


    const confirmed =
        confirm(
            `Artikel "${article.title}" wirklich löschen?`
        );


    if (!confirmed) return;


    news =
        news.filter(item =>
            item.id !== id
        );


    saveNews();


    renderAdminArticles();


    renderNews(news);

}


/* =========================================================
   EDITOR LEEREN
========================================================= */

function clearEditor() {

    editingId = null;


    document
        .getElementById("editorHeading")
        .textContent =
            "Neuer Artikel";


    document
        .getElementById("titleInput")
        .value = "";


    document
        .getElementById("descriptionInput")
        .value = "";


    document
        .getElementById("categoryInput")
        .value =
            "Deutschland";


    document
        .getElementById("regionInput")
        .value = "";


    document
        .getElementById("textInput")
        .value = "";

}


/* =========================================================
   ADMIN ARTIKELLISTE
========================================================= */

function renderAdminArticles() {

    const container =
        document
        .getElementById("adminArticleList");


    container.innerHTML = "";


    if (news.length === 0) {

        container.innerHTML = `
            <div class="admin-item">
                Noch keine Artikel vorhanden.
            </div>
        `;

        return;
    }


    news.forEach(item => {

        const row =
            document.createElement("div");


        row.className =
            "admin-item";


        row.innerHTML = `

            <div>

                <div class="admin-item-title">
                    ${escapeHTML(item.title)}
                </div>

                <small>
                    ${escapeHTML(item.category)}
                    ·
                    ${escapeHTML(item.date)}
                </small>

            </div>

            <div class="admin-item-actions">

                <button
                    class="small-button edit"
                    onclick="editArticle(${item.id})"
                >
                    Bearbeiten
                </button>

                <button
                    class="small-button delete"
                    onclick="deleteArticle(${item.id})"
                >
                    Löschen
                </button>

            </div>

        `;


        container.appendChild(row);

    });

}


/* =========================================================
   SICHERER TEXT
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   START
========================================================= */

renderNews();

</script>

</html>
