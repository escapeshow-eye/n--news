<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>n: – Nachrichten</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #111;
}

/* =========================
   HEADER
========================= */

header {
    height: 72px;
    padding: 0 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(255,255,255,.96);
    border-bottom: 1px solid #ddd;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -4px;
    cursor: pointer;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.header-btn {
    border: 0;
    background: transparent;

    font-size: 20px;
    padding: 10px;

    border-radius: 10px;
    cursor: pointer;
}

.header-btn:hover {
    background: #eee;
}

/* =========================
   MAIN
========================= */

main {
    max-width: 1200px;
    margin: auto;
    padding: 45px 20px 80px;
}

/* =========================
   HERO
========================= */

.hero {
    margin-bottom: 25px;
}

.hero-label {
    font-size: 12px;
    font-weight: 800;
    color: #777;

    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 72px);
    line-height: .95;
    letter-spacing: -4px;

    margin: 8px 0;
}

.hero p {
    color: #777;
    font-size: 18px;
}

/* =========================
   SEARCH
========================= */

.search {
    display: none;
    margin-bottom: 20px;
}

.search input {
    width: 100%;

    padding: 15px;

    border: 1px solid #ddd;
    border-radius: 13px;

    outline: none;
    font-size: 16px;
}

/* =========================
   FILTER
========================= */

.filters {
    display: flex;
    gap: 8px;

    overflow-x: auto;
    padding-bottom: 20px;
}

.filter {
    flex-shrink: 0;

    padding: 10px 16px;

    border: 1px solid #ddd;
    border-radius: 999px;

    background: white;

    font-weight: 700;
    cursor: pointer;
}

.filter.active {
    background: #111;
    color: white;
    border-color: #111;
}

/* =========================
   NEWS GRID
========================= */

.news-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}

.news-card {
    background: white;

    border: 1px solid #ddd;
    border-radius: 20px;

    overflow: hidden;
    cursor: pointer;

    transition: .2s;
}

.news-card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 30px rgba(0,0,0,.08);
}

.news-image {
    width: 100%;
    height: 190px;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #ddd,
            #fafafa
        );

    color: #999;

    font-size: 38px;
    font-weight: 900;

    overflow: hidden;
}

.news-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    display: block;
}

.news-card-content {
    padding: 20px;
}

.news-meta {
    font-size: 13px;
    color: #777;

    margin-bottom: 8px;
}

.news-card h2 {
    margin: 0 0 10px;
    font-size: 22px;
}

.news-card p {
    color: #777;
    line-height: 1.5;
    margin: 0;
}

/* =========================
   FEATURED
========================= */

.featured {
    grid-column: 1 / -1;

    background: white;

    border: 1px solid #ddd;
    border-left: 5px solid #111;

    border-radius: 20px;

    overflow: hidden;
    cursor: pointer;
}

.featured-image {
    width: 100%;
    height: 280px;

    background:
        linear-gradient(
            135deg,
            #ddd,
            #fafafa
        );

    display: flex;
    justify-content: center;
    align-items: center;

    color: #999;

    font-size: 45px;
    font-weight: 900;

    overflow: hidden;
}

.featured-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    display: block;
}

.featured-content {
    padding: 25px;
}

.featured-label {
    font-size: 12px;
    font-weight: 900;
    margin-bottom: 8px;
}

.featured h2 {
    margin: 0;

    font-size:
        clamp(28px,4vw,40px);
}

/* =========================
   STATUS
========================= */

.status-box {
    grid-column: 1 / -1;

    background: white;

    border: 1px solid #ddd;

    border-radius: 20px;

    padding: 35px;

    text-align: center;

    color: #777;

/* =========================
   ARTICLE
========================= */

.article {
    display: none;

    max-width: 850px;

    margin: auto;
}

.back {
    padding: 10px 15px;

    border: 1px solid #ddd;

    background: white;

.article-image img {

}

.article-text {

/* =========================
   ADMIN
========================= */

.login {

}

.login input,

.form-box textarea {

.form-box {

/* =========================

.image-upload-box {
    margin: 5px 0 20px;

.image-upload-box input[type="file"] {

    border: 1px solid #ddd;
}

.current-image {

}

/* =========================
   BUTTONS
========================= */

.primary,
.secondary,
.small {

    border: 0;

    padding: 11px 16px;

    font-weight: 800;

    cursor: pointer;

.primary {
    background: #111;
    color: white;
}

.primary:hover {
    background: #333;
}

.secondary {
    background: #eee;
}

.secondary:hover {
    background: #ddd;
}

.primary:disabled {
    opacity: .6;
    cursor: wait;

.admin-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
}

.admin-list {
    display: grid;

    gap: 10px;

    margin-top: 15px;

.admin-item {
    background: white;

    border: 1px solid #ddd;

    border-radius: 15px;

    display: flex;

    justify-content: space-between;

.admin-item-title {

.admin-actions {

.delete {

.error {

}

.success {

}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    padding: 30px;

    color: #777;

    border-top: 1px solid #ddd;
}

/* =========================

========================= */

@media (max-width: 850px) {

    }

}

@media (max-width: 600px) {

    }

    .featured {
        grid-column: auto;
    }

    .admin-item {
        flex-direction: column;
    }

    .admin-actions {
        width: 100%;
    }

}

</style>

<!-- =====================================================
     SUPABASE JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://eqzmsuncndfsiedyfifb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_eXY1gg_tIr-cRC2kdt0jbQ_QPfbEmkF";

const STORAGE_BUCKET =
    "news-images";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: false
            }
        }
    );


/* =====================================================
   VARIABLEN
===================================================== */

let articles = [];

let activeFilter = "Alle";

let editingId = null;

let editingImageUrl = null;


/* =====================================================
   SESSION AUTOMATISCH ÜBERWACHEN
===================================================== */

supabase.auth.onAuthStateChange(
    async (event, session) => {

        console.log(
            "Auth:",
            event
        );

        if (
            event === "TOKEN_REFRESHED"
        ) {

            console.log(
                "🔄 Sitzung automatisch erneuert."
            );

        }

        if (
            event === "SIGNED_OUT"
        ) {

            console.log(
                "👋 Ausgeloggt."
            );

        }

    }
);


/* =====================================================
   BILD VORSCHAU
===================================================== */

function previewImage(event) {

    const file =
        event.target.files[0];

    const preview =
        document.getElementById(
            "imagePreview"
        );

    if (!file) {

        preview.style.display =
            "none";

        preview.removeAttribute(
            "src"
        );

        return;

    }

    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Bitte eine Bilddatei auswählen."
        );

        event.target.value = "";

        return;

    }

    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Das Bild darf maximal 10 MB groß sein."
        );

        event.target.value = "";

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function(e) {

            preview.src =
                e.target.result;

            preview.style.display =
                "block";

        };

    reader.readAsDataURL(file);

}


/* =====================================================
   BILD HOCHLADEN
===================================================== */

async function uploadImage(file) {

    if (!file) {
        return null;
    }

    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        throw new Error(
            "Die ausgewählte Datei ist kein Bild."
        );

    }

    if (
        file.size >
        10 * 1024 * 1024
    ) {

        throw new Error(
            "Das Bild ist zu groß. Maximal 10 MB."
        );

    }


    const {
        data: {
            session
        },
        error: sessionError
    } =
        await supabase.auth.getSession();


    if (
        sessionError ||
        !session
    ) {

        throw new Error(
            "Deine Anmeldung ist abgelaufen. Bitte erneut einloggen."
        );

    }


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase()
            .replace(
                /[^a-z0-9]/g,
                ""
            );


    const filename =
        `${Date.now()}-${crypto.randomUUID()}.${extension}`;


    const {
        error
    } =
        await supabase.storage
            .from(STORAGE_BUCKET)
            .upload(
                filename,
                file,
                {
                    contentType:
                        file.type,
                    upsert:
                        false
                }
            );


    if (error) {

        console.error(
            "Upload:",
            error
        );

        throw new Error(
            error.message
        );

    }


    const {
        data
    } =
        supabase.storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(
                filename
            );


    return data.publicUrl;

}


/* =====================================================
   NEWS LADEN
===================================================== */

async function loadNews() {

    const grid =
        document.getElementById(
            "newsGrid"
        );

    grid.innerHTML = `

        <div class="status-box">

            Nachrichten werden geladen …

        </div>

    `;


    try {

        /*
           Supabase übernimmt jetzt
           automatisch das richtige
           JWT und erneuert es bei Bedarf.
        */

        const {
            data,
            error
        } =
            await supabase
                .from("news")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }


        articles =
            Array.isArray(data)
                ? data
                : [];


        renderNews(
            articles
        );


    } catch (error) {

        console.error(
            error
        );


        grid.innerHTML = `

            <div class="status-box">

                <strong>
                    Nachrichten konnten nicht geladen werden.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Unbekannter Fehler"
                )}

                <br><br>

                <button
                    class="secondary"
                    onclick="loadNews()">

                    🔄 Erneut versuchen

                </button>

            </div>

        `;

    }

}


/* =====================================================
   BILD HTML
===================================================== */

function getNewsImageHTML(article) {

    if (
        article.image_url
    ) {

        return `

            <img
                src="${escapeHTML(article.image_url)}"
                alt="${escapeHTML(article.title || "Artikelbild")}"
                loading="lazy"
                onerror="this.style.display='none'; this.parentElement.innerHTML='n:'">

        `;

    }

    return "n:";

}


/* =====================================================
   NEWS RENDERN
===================================================== */

function renderNews(list) {

    const grid =
        document.getElementById(
            "newsGrid"
        );


    grid.innerHTML = "";


    if (
        !list.length
    ) {

        grid.innerHTML = `

            <div class="status-box">

                Noch keine Nachrichten vorhanden.

            </div>

        `;

        return;

    }


    if (
        activeFilter === "Alle"
        &&
        list.length > 0
    ) {

        const first =
            list[0];


        const featured =
            document.createElement(
                "div"
            );


        featured.className =
            "featured";


        featured.onclick =
            () =>
                openArticle(
                    first.id
                );


        featured.innerHTML = `

            <div class="featured-image">

                ${getNewsImageHTML(first)}

            </div>

            <div class="featured-content">

                <div class="featured-label">

                    ● AKTUELL

                </div>

                <h2>

                    ${escapeHTML(
                        first.title
                    )}

                </h2>

            </div>

        `;


        grid.appendChild(
            featured
        );

    }


    list.forEach(
        (item,index) => {

            if (
                activeFilter === "Alle"
                &&
                index === 0
            ) {

                return;

            }


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "news-card";


            card.onclick =
                () =>
                    openArticle(
                        item.id
                    );


            card.innerHTML = `

                <div class="news-image">

                    ${getNewsImageHTML(item)}

                </div>

                <div class="news-card-content">

                    <div class="news-meta">

                        ${escapeHTML(
                            item.category || ""
                        )}

                        ·

                        ${escapeHTML(
                            item.region || ""
                        )}

                    </div>

                    <h2>

                        ${escapeHTML(
                            item.title || ""
                        )}

                    </h2>

                    <p>

                        ${escapeHTML(
                            item.description || ""
                        )}

                    </p>

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   FILTER
===================================================== */

function filterNews(
    category,
    button
) {

    activeFilter =
        category;


    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            x =>
                x.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    if (
        category === "Alle"
    ) {

        renderNews(
            articles
        );

        return;

    }


    const filtered =
        articles.filter(
            item =>
                item.category ===
                    category
                ||
                item.region ===
                    category
        );


    renderNews(
        filtered
    );

}


/* =====================================================
   SUCHE
===================================================== */

function toggleSearch() {

    const box =
        document.getElementById(
            "searchBox"
        );


    if (
        box.style.display ===
        "block"
    ) {

        box.style.display =
            "none";

    } else {

        box.style.display =
            "block";

        document
            .getElementById(
                "searchInput"
            )
            .focus();

    }

}


function searchNews() {

    const value =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    if (!value) {

        renderNews(
            articles
        );

        return;

    }


    const results =
        articles.filter(
            item => {

                return (

                    String(
                        item.title || ""
                    )
                    .toLowerCase()
                    .includes(value)

                    ||

                    String(
                        item.description || ""
                    )
                    .toLowerCase()
                    .includes(value)

                    ||

                    String(
                        item.content || ""
                    )
                    .toLowerCase()
                    .includes(value)

                    ||

                    String(
                        item.category || ""
                    )
                    .toLowerCase()
                    .includes(value)

                    ||

                    String(
                        item.region || ""
                    )
                    .toLowerCase()
                    .includes(value)

                );

            }
        );


    renderNews(
        results
    );

}

function openArticle(id) {

    }


    document
        .getElementById(
            "home"
        )

    document
        .getElementById(
            "admin"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "article"
        )
        .style.display =
            "block";


    document
        .getElementById(
            "articleMeta"
        )
        .textContent =

        `${article.category || ""} · ${
            article.region || ""
        }`;


    document
        .getElementById(
            "articleTitle"
        )
        .textContent =

        document.getElementById(

        );

        )
        .innerHTML =

        escapeHTML(
            article.content || ""
        )
        .replace(
            /\n/g,
            "<br><br>"
        );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        document
            .getElementById(
                "email"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    const error =
        document
            .getElementById(
                "loginError"
            );


    error.textContent = "";


    if (
        !email ||
        !password
    ) {

        error.textContent =
            "Bitte E-Mail und Passwort eingeben.";

        return;

    }


    try {

        const {
            data,
            error: loginError
        } =
            await supabase.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        if (
            loginError
        ) {

            throw loginError;

        }


        console.log(
            "Login erfolgreich:",
            data.user
        );


        showDashboard();


    } catch (error) {

        console.error(
            error
        );


        document
            .getElementById(
                "loginError"
            )
            .textContent =

                "❌ " +
                (
                    error.message ||
                    "Login fehlgeschlagen."
                );

    }

}


/* =====================================================
   SESSION PRÜFEN
===================================================== */

async function checkSession() {

    try {

        const {
            data,
            error
        } =
            await supabase.auth
                .getSession();


        if (
            error
        ) {

            throw error;

        }


        if (
            data.session
        ) {

            showDashboard();

        } else {

            document
                .getElementById(
                    "loginBox"
                )
                .style.display =
                    "block";


            document
                .getElementById(
                    "dashboard"
                )
                .style.display =
                    "none";

        }

    } catch (error) {

        console.error(
            error
        );


        document
            .getElementById(
                "loginBox"
            )
            .style.display =
                "block";


        document
            .getElementById(
                "dashboard"
            )
            .style.display =
                "none";

    }

}

/* =====================================================
   ADMIN LISTE
===================================================== */

function renderAdmin() {

    const list =
        document.getElementById(
            "adminList"
        );


    list.innerHTML = "";


    if (
        !articles.length
    ) {

        list.innerHTML = `

            <div class="status-box">

                Noch keine Artikel.

            </div>

        `;

        return;

    }


    articles.forEach(
        article => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "admin-item";


            item.innerHTML = `

                <div>

                    <div class="admin-item-title">

                        ${escapeHTML(
                            article.title || ""
                        )}

                    </div>

                    <small>

                        ${escapeHTML(
                            article.category || ""
                        )}

                        ·

                        ${escapeHTML(
                            article.region || ""
                        )}

                    </small>

                </div>

                <div class="admin-actions">

                    <button
                        class="small edit"
                        onclick="editArticle(${article.id})">

                        Bearbeiten

                    </button>

                    <button
                        class="small delete"
                        onclick="deleteArticle(${article.id})">

                        Löschen

                    </button>

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   ARTIKEL SPEICHERN
===================================================== */

async function saveArticle() {

    const title =
        document
            .getElementById(
                "title"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "description"
            )
            .value
            .trim();


    const category =
        document
            .getElementById(
                "category"
            )
            .value;


    const region =
        document
            .getElementById(
                "region"
            )
            .value
            .trim();


    const content =
        document
            .getElementById(
                "content"
            )
            .value
            .trim();


    const imageFile =
        document
            .getElementById(
                "imageFile"
            )
            .files[0];


    const message =
        document.getElementById(
            "formMessage"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    if (
        !title ||
        !description ||
        !region ||
        !content
    ) {

        message.className =
            "error";

        message.textContent =
            "Bitte alle Felder ausfüllen.";

        return;

    }


    try {

        saveButton.disabled =
            true;

        saveButton.textContent =
            "⏳ Wird gespeichert...";

        message.className =
            "success";

        message.textContent =
            "";


        /*
           BILD
        */

        let imageUrl =
            editingImageUrl;


        if (
            imageFile
        ) {

            message.textContent =
                "🖼️ Bild wird hochgeladen...";


            imageUrl =
                await uploadImage(
                    imageFile
                );

        }


        /*
           ARTIKEL
        */

        message.textContent =
            "📰 Artikel wird gespeichert...";


        if (
            editingId !== null
        ) {

            const {
                error
            } =
                await supabase
                    .from("news")
                    .update({

                        title:
                            title,

                        description:
                            description,

                        category:
                            category,

                        region:
                            region,

                        content:
                            content,

                        image_url:
                            imageUrl

                    })
                    .eq(
                        "id",
                        editingId
                    );


            if (
                error
            ) {

                throw error;

            }


            message.textContent =
                "✅ Artikel aktualisiert.";

        } else {

            const {
                error
            } =
                await supabase
                    .from("news")
                    .insert({

                        title:
                            title,

                        description:
                            description,

                        category:
                            category,

                        region:
                            region,

                        content:
                            content,

                        image_url:
                            imageUrl

                    });


            if (
                error
            ) {

                throw error;

            }


            message.textContent =
                "📰 Artikel veröffentlicht.";

        }


        clearForm();


        await loadNews();


        renderAdmin();


    } catch (error) {

        console.error(
            error
        );


        message.className =
            "error";


        message.textContent =
            "Fehler: " +
            (
                error.message ||
                "Unbekannter Fehler"
            );

    } finally {

        saveButton.disabled =
            false;


        saveButton.textContent =
            editingId !== null
                ? "Änderungen speichern"
                : "📰 Veröffentlichen";

    }

}


/* =====================================================
   ARTIKEL BEARBEITEN
===================================================== */

function editArticle(id) {

    const article =
        articles.find(
            x =>
                x.id === id
        );


    if (!article) {
        return;
    }


    editingId =
        id;


    editingImageUrl =
        article.image_url ||
        null;


    document
        .getElementById(
            "formTitle"
        )
        .textContent =
            "Artikel bearbeiten";


    document
        .getElementById(
            "title"
        )
        .value =
            article.title || "";


    document
        .getElementById(
            "description"
        )
        .value =
            article.description || "";


    document
        .getElementById(
            "category"
        )
        .value =
            article.category ||
            "Deutschland";


    document
        .getElementById(
            "region"
        )
        .value =
            article.region || "";


    document
        .getElementById(
            "content"
        )
        .value =
            article.content || "";


    document
        .getElementById(
            "imageFile"
        )
        .value =
            "";


    const preview =
        document.getElementById(
            "imagePreview"
        );


    const current =
        document.getElementById(
            "currentImage"
        );


    if (
        article.image_url
    ) {

        preview.src =
            article.image_url;

        preview.style.display =
            "block";

        current.textContent =
            "Aktuelles Bild – du kannst ein neues Bild auswählen.";

    } else {

        preview.style.display =
            "none";

        current.textContent =
            "";

    }


    document
        .getElementById(
            "saveButton"
        )
        .textContent =
            "Änderungen speichern";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   ARTIKEL LÖSCHEN
===================================================== */

async function deleteArticle(id) {

    const article =
        articles.find(
            x =>
                x.id === id
        );


    if (!article) {
        return;
    }


    if (
        !confirm(
            `„${article.title}“ wirklich löschen?`
        )
    ) {

        return;

    }


    try {

        const {
            error
        } =
            await supabase
                .from("news")
                .delete()
                .eq(
                    "id",
                    id
                );


        if (
            error
        ) {

            throw error;

        }


        await loadNews();


        renderAdmin();


    } catch (error) {

        console.error(
            error
        );


        alert(
            "Fehler beim Löschen:\n\n" +
            (
                error.message ||
                "Unbekannter Fehler"
            )
        );

    }

}

/* =====================================================
   HTML SICHER AUSGEBEN
===================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
