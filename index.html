<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>n: – Start</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background: #f4f5f7;
    color: #111;

    display: flex;
    flex-direction: column;
}


/* =========================
   HEADER
========================= */

header {
    height: 72px;

    padding: 0 28px;

    display: flex;
    align-items: center;

    background: rgba(255,255,255,.96);

    border-bottom: 1px solid #ddd;
}

.logo {
    font-size: 40px;
    font-weight: 900;

    letter-spacing: -4px;
}


/* =========================
   MAIN
========================= */

main {
    flex: 1;

    max-width: 1100px;

    width: 100%;

    margin: auto;

    padding: 70px 20px;
}


/* =========================
   HERO
========================= */

.hero {
    text-align: center;

    margin-bottom: 55px;
}

.hero-label {
    font-size: 13px;

    font-weight: 800;

    color: #777;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 12px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 72px);

    line-height: .95;

    letter-spacing: -4px;

    margin: 0 0 18px;
}

.hero p {
    margin: 0;

    color: #777;

    font-size: 19px;
}


/* =========================
   CHOICES
========================= */

.choices {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}


.choice {

    background: white;

    border: 1px solid #ddd;

    border-radius: 24px;

    padding: 45px 35px;

    min-height: 280px;

    cursor: pointer;

    text-decoration: none;

    color: #111;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    transition: .2s;
}


.choice:hover {

    transform: translateY(-5px);

    box-shadow:
        0 15px 35px rgba(0,0,0,.09);

}


.choice-icon {

    font-size: 55px;

    margin-bottom: 20px;
}


.choice h2 {

    margin: 0 0 10px;

    font-size: 30px;

    letter-spacing: -1px;
}


.choice p {

    margin: 0;

    color: #777;

    font-size: 16px;

    line-height: 1.5;

}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 30px;

    color: #777;

    border-top: 1px solid #ddd;

    background: white;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    main {
        padding:
            45px 18px;
    }

    .choices {

        grid-template-columns: 1fr;

    }

    .choice {

        min-height: 220px;

        padding: 35px 25px;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        n:
    </div>

</header>


<main>


    <section class="hero">

        <div class="hero-label">
            n: Informationsportal
        </div>

        <h1>
            Was möchtest du öffnen?
        </h1>

        <p>
            Nachrichten, Verkehr und mehr.
        </p>

    </section>


    <section class="choices">


        <!-- NEWS -->

        <a
            class="choice"
            href="news.html">

            <div class="choice-icon">
                📰
            </div>

            <h2>
                News
            </h2>

            <p>
                Aktuelle Nachrichten.
                Einfach und direkt.
            </p>

        </a>


        <!-- VERKEHR -->

        <a
            class="choice"
            href="verkehr.html">

            <div class="choice-icon">
                🚗
            </div>

            <h2>
                Verkehr & Route
            </h2>

            <p>
                Verkehrslage, Routen
                und Informationen unterwegs.
            </p>

        </a>


    </section>


</main>


<footer>

    © 2026 n: · Informationsportal

</footer>


</body>

</html>
