<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n: – Verkehr & Route</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#111}
header{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.97);border-bottom:1px solid #ddd;position:sticky;top:0;z-index:20}
.logo{font-size:40px;font-weight:900;letter-spacing:-4px;cursor:pointer}
.header-btn{border:0;background:transparent;font-size:20px;padding:10px;border-radius:10px;cursor:pointer}
.header-btn:hover{background:#eee}
main{max-width:1200px;margin:auto;padding:42px 20px 70px}
.hero-label{font-size:12px;font-weight:800;color:#777;text-transform:uppercase;letter-spacing:1.5px}
.hero h1{font-size:clamp(42px,7vw,72px);line-height:.95;letter-spacing:-4px;margin:8px 0}
.hero p{color:#777;font-size:18px}
.box{background:#fff;border:1px solid #ddd;border-radius:22px;padding:24px;margin-top:25px}
.box h2{margin:0 0 18px}
.route-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;outline:0;font-size:16px;background:#fff}
input:focus,select:focus{border-color:#111}
button.primary{border:0;border-radius:12px;padding:13px 18px;background:#111;color:#fff;font-weight:800;cursor:pointer}
button.primary:hover{background:#333}
button.secondary{border:0;border-radius:12px;padding:11px 15px;background:#eee;font-weight:800;cursor:pointer}
.route-result{display:none;margin-top:18px;padding:20px;border-radius:16px;background:#f4f5f7}
.route-main{font-size:28px;font-weight:900;margin-bottom:5px}
.route-sub{color:#666}
.steps{margin-top:18px;display:grid;gap:8px}
.step{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:38px;margin-bottom:15px}
.section-head h2{margin:0}
.status{font-size:13px;color:#777}
.traffic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.traffic-card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px}
.traffic-card h3{margin:0 0 8px;font-size:19px}
.traffic-card p{margin:6px 0;color:#555;line-height:1.5}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#eee;font-size:11px;font-weight:900;margin-bottom:10px}
.warning-road{font-weight:900}
.empty{background:#fff;border:1px solid #ddd;border-radius:18px;padding:25px;color:#777}
.error{color:#b91c1c;background:#fee2e2;border:1px solid #fecaca;border-radius:12px;padding:14px;margin-top:12px}
footer{text-align:center;padding:30px;color:#777;border-top:1px solid #ddd}
@media(max-width:750px){
.route-grid{grid-template-columns:1fr}
.traffic-grid{grid-template-columns:1fr}
.section-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='index.html'">n:</div>
<button class="header-btn" onclick="location.href='index.html'" title="Nachrichten">📰</button>
</header>

<main>
<section>
<div class="hero-label">n: Verkehr & Route</div>
<h1>Unterwegs?</h1>
<p>Routen berechnen und aktuelle Verkehrsmeldungen für deutsche Autobahnen.</p>
</section>

<section class="box">
<h2>🧭 Route berechnen</h2>
<div class="route-grid">
<input id="start" placeholder="Start, z. B. Gelnhausen">
<input id="destination" placeholder="Ziel, z. B. Frankfurt">
<button class="primary" id="routeBtn" onclick="calculateRoute()">Route berechnen</button>
</div>
<div id="routeResult" class="route-result"></div>
</section>

<section>
<div class="section-head">
<h2>🚦 Verkehr aktuell</h2>
<div>
<span class="status" id="trafficStatus">Wird geladen …</span>
<button class="secondary" onclick="loadTraffic()">↻ Aktualisieren</button>
</div>
</div>
<div id="trafficList" class="traffic-grid">
<div class="empty">Verkehrsmeldungen werden geladen …</div>
</div>
</section>
</main>

<footer>© 2026 n: · Verkehr & Route</footer>

<script>
const GEOCODER="https://nominatim.openstreetmap.org/search";
const ROUTER="https://router.project-osrm.org/route/v1/driving";
const TRAFFIC_BASE="https://verkehr.autobahn.de/o/autobahn";

function escapeHTML(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

async function geocode(place){
 const url=GEOCODER+"?format=jsonv2&limit=1&countrycodes=de&q="+encodeURIComponent(place);
 const r=await fetch(url,{headers:{"Accept":"application/json"}});
 if(!r.ok) throw new Error("Ort konnte nicht gesucht werden.");
 const data=await r.json();
 if(!data.length) throw new Error("Ort nicht gefunden: "+place);
 return {lat:Number(data[0].lat),lon:Number(data[0].lon),name:data[0].display_name};
}

function formatDistance(m){
 if(m>=1000)return (m/1000).toFixed(1)+" km";
 return Math.round(m)+" m";
}
function formatDuration(s){
 const min=Math.round(s/60);
 if(min<60)return min+" Min.";
 const h=Math.floor(min/60),m=min%60;
 return h+" Std. "+(m?m+" Min.":"");
}

async function calculateRoute(){
 const start=document.getElementById("start").value.trim();
 const destination=document.getElementById("destination").value.trim();
 const result=document.getElementById("routeResult");
 const btn=document.getElementById("routeBtn");
 if(!start||!destination){
   result.style.display="block";
   result.innerHTML='<div class="error">Bitte Start und Ziel eingeben.</div>';
   return;
 }
 btn.disabled=true; btn.textContent="⏳ Berechne …";
 result.style.display="block";
 result.innerHTML="Orte werden gesucht …";
 try{
   const [a,b]=await Promise.all([geocode(start),geocode(destination)]);
   const url=ROUTER+"/"+a.lon+","+a.lat+";"+b.lon+","+b.lat+"?overview=false&steps=true&alternatives=true";
   const r=await fetch(url);
   if(!r.ok)throw new Error("Routenserver nicht erreichbar.");
   const data=await r.json();
   if(data.code!=="Ok"||!data.routes?.length)throw new Error("Keine Route gefunden.");
   const route=data.routes[0];
   const steps=(route.legs?.[0]?.steps||[]).filter(x=>x.name||x.maneuver);
   result.innerHTML=`
    <div class="route-main">${formatDistance(route.distance)} · ${formatDuration(route.duration)}</div>
    <div class="route-sub">${escapeHTML(a.name)} → ${escapeHTML(b.name)}</div>
    <div class="steps">
      ${steps.slice(0,12).map((s,i)=>{
        const road=s.name?escapeHTML(s.name):"Straße";
        const type=s.maneuver?.type||"";
        const modifier=s.maneuver?.modifier||"";
        return `<div class="step"><strong>${i+1}.</strong> ${escapeHTML(type)} ${escapeHTML(modifier)} · ${road} · ${formatDistance(s.distance)}</div>`;
      }).join("")}
    </div>`;
 }catch(e){
   console.error(e);
   result.innerHTML='<div class="error">'+escapeHTML(e.message)+'</div>';
 }finally{
   btn.disabled=false;btn.textContent="Route berechnen";
 }
}

function roadList(){
 return ["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10","A11","A12","A13","A14","A15","A17","A19","A20","A21","A23","A24","A25","A26","A27","A28","A29","A30","A31","A33","A36","A38","A39","A40","A42","A43","A44","A45","A46","A48","A49","A52","A57","A59","A60","A61","A62","A63","A64","A65","A66","A67","A70","A71","A72","A73","A81","A92","A93","A94","A95","A96","A98","A99"];
}

async function loadRoadWarnings(road){
 try{
   const r=await fetch(`${TRAFFIC_BASE}/${road}/services/warning`);
   if(!r.ok)throw new Error();
   const data=await r.json();
   return (data.warning||[]).map(x=>({...x,road}));
 }catch{return [];}
}

async function loadTraffic(){
 const list=document.getElementById("trafficList");
 const status=document.getElementById("trafficStatus");
 list.innerHTML='<div class="empty">Aktuelle Verkehrsmeldungen werden geladen …</div>';
 status.textContent="Aktualisiere …";
 try{
   const roads=roadList();
   const chunks=[];
   for(let i=0;i<roads.length;i+=10)chunks.push(roads.slice(i,i+10));
   let all=[];
   for(const chunk of chunks){
     const part=await Promise.all(chunk.map(loadRoadWarnings));
     all.push(...part.flat());
     if(all.length>=30)break;
   }
   const unique=[];
   const seen=new Set();
   for(const x of all){
     const key=x.identifier||x.subtitle||x.title;
     if(!seen.has(key)){seen.add(key);unique.push(x);}
   }
   if(!unique.length){
     list.innerHTML='<div class="empty">Keine Verkehrsmeldungen gefunden oder die Verkehrsdaten sind momentan nicht erreichbar.</div>';
   }else{
     list.innerHTML=unique.slice(0,30).map(x=>`
       <article class="traffic-card">
         <span class="badge">🚦 ${escapeHTML(x.road||"AUTObahn")}</span>
         <h3>${escapeHTML(x.subtitle||x.title||"Verkehrsmeldung")}</h3>
         <p>${escapeHTML(Array.isArray(x.description)?(x.description[0]||""):x.description||"")}</p>
         ${x.delayTimeValue?`<p><strong>Verzögerung:</strong> ${escapeHTML(x.delayTimeValue)}</p>`:""}
         ${x.averageSpeed?`<p><strong>Ø Geschwindigkeit:</strong> ${escapeHTML(x.averageSpeed)}</p>`:""}
       </article>`).join("");
   }
   status.textContent="Aktualisiert: "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
 }catch(e){
   list.innerHTML='<div class="empty">Verkehrsdaten konnten momentan nicht geladen werden.</div>';
   status.textContent="Fehler beim Aktualisieren";
 }
}

document.addEventListener("DOMContentLoaded",loadTraffic);
</script>
</body>
</html>
