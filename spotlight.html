<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n: spotlight</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#08090c;
    --bg2:#101218;
    --card:#15171d;
    --card2:#1b1e26;
    --text:#f5f6f8;
    --muted:#9da2ad;
    --line:#292d37;
    --accent:#ffffff;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 75% -10%,#242a38 0,transparent 34%),
        radial-gradient(circle at 5% 20%,#171a23 0,transparent 30%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:100;
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5vw;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(8,9,12,.82);
    backdrop-filter:blur(18px);
}

.logo{
    text-decoration:none;
    color:#fff;
    font-size:31px;
    font-weight:900;
    letter-spacing:-2px;
}

.logo span{
    font-size:13px;
    letter-spacing:2px;
    margin-left:8px;
    color:#9da2ad;
    font-weight:600;
}

.nav{
    display:flex;
    align-items:center;
    gap:8px;
}

.nav button{
    border:0;
    background:transparent;
    color:#aeb3bd;
    padding:10px 13px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.nav button:hover,
.nav button.active{
    color:#fff;
    background:#1b1e25;
}

.login-btn{
    border:1px solid #30343e !important;
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    overflow:hidden;
    min-height:480px;
    display:flex;
    align-items:flex-end;
    padding:70px 5vw 55px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(90deg,rgba(8,9,12,.98) 0%,rgba(8,9,12,.78) 40%,rgba(8,9,12,.22) 100%);
    z-index:1;
}

.hero-image{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:.72;
    filter:saturate(.85);
}

.hero-content{
    position:relative;
    z-index:2;
    width:min(900px,100%);
}

.kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#c4c8d0;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:18px;
}

.kicker::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:#fff;
}

.hero h1{
    font-size:clamp(38px,6vw,76px);
    line-height:.98;
    letter-spacing:-3px;
    max-width:900px;
    margin-bottom:22px;
}

.hero p{
    max-width:720px;
    color:#c0c4cc;
    font-size:17px;
    line-height:1.65;
}

/* =========================
   MAIN
========================= */

main{
    width:min(1400px,90%);
    margin:0 auto;
    padding:48px 0 90px;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:25px;
    margin-bottom:24px;
}

.section-head h2{
    font-size:28px;
    letter-spacing:-1px;
}

.section-head p{
    color:var(--muted);
    font-size:14px;
}

/* =========================
   SEARCH / FILTER
========================= */

.tools{
    display:flex;
    gap:12px;
    margin-bottom:35px;
}

.search{
    flex:1;
    background:#111319;
    border:1px solid var(--line);
    border-radius:13px;
    color:#fff;
    padding:14px 16px;
    outline:none;
    font-size:14px;
}

.search:focus{
    border-color:#555b68;
}

.categories{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.category{
    border:1px solid var(--line);
    background:#111319;
    color:#9da2ad;
    padding:10px 14px;
    border-radius:999px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.category:hover,
.category.active{
    background:#fff;
    color:#08090c;
    border-color:#fff;
}

/* =========================
   FEATURED
========================= */

.featured{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    min-height:380px;
    background:linear-gradient(135deg,#171a21,#101218);
    border:1px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
    margin-bottom:55px;
}

.featured:hover{
    transform:translateY(-3px);
    border-color:#414652;
}

.featured-image{
    min-height:380px;
    background-size:cover;
    background-position:center;
}

.featured-content{
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.featured-content .label{
    color:#9da2ad;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:800;
    margin-bottom:15px;
}

.featured-content h2{
    font-size:clamp(27px,3vw,45px);
    line-height:1.05;
    letter-spacing:-1.5px;
    margin-bottom:18px;
}

.featured-content p{
    color:#aeb3bd;
    line-height:1.6;
}

/* =========================
   GRID
========================= */

.article-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:20px;
}

.article-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:19px;
    overflow:hidden;
    cursor:pointer;
    transition:.22s;
}

.article-card:hover{
    transform:translateY(-4px);
    background:var(--card2);
    border-color:#3a3e48;
}

.card-image{
    width:100%;
    aspect-ratio:16/9;
    background:#20232b;
    background-size:cover;
    background-position:center;
}

.card-body{
    padding:21px;
}

.card-category{
    color:#8e94a0;
    text-transform:uppercase;
    letter-spacing:1.2px;
    font-size:10px;
    font-weight:800;
    margin-bottom:10px;
}

.card-title{
    font-size:20px;
    line-height:1.2;
    letter-spacing:-.4px;
    margin-bottom:10px;
}

.card-description{
    color:#9298a3;
    font-size:14px;
    line-height:1.55;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

/* =========================
   ARTICLE VIEW
========================= */

.article-view{
    display:none;
    max-width:1050px;
    margin:0 auto;
}

.back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#171a21;
    color:#d5d8de;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    margin-bottom:30px;
}

.article-meta{
    color:#969ca7;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    font-weight:800;
    margin-bottom:16px;
}

.article-view h1{
    font-size:clamp(38px,6vw,70px);
    line-height:1;
    letter-spacing:-3px;
    margin-bottom:20px;
}

.article-lead{
    color:#b6bbc4;
    font-size:19px;
    line-height:1.6;
    margin-bottom:30px;
}

.article-main-image{
    width:100%;
    max-height:650px;
    object-fit:cover;
    border-radius:20px;
    margin-bottom:28px;
}

.article-content{
    font-size:17px;
    line-height:1.8;
    color:#d4d7dd;
    white-space:pre-wrap;
}

.article-images{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:30px;
}

.article-images img{
    width:100%;
    border-radius:16px;
    cursor:pointer;
    transition:.2s;
}

.article-images img:hover{
    opacity:.8;
}

.article-video{
    width:100%;
    margin-top:30px;
    border-radius:18px;
    background:#000;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:80px 20px;
    color:#777d88;
    border:1px dashed #30343d;
    border-radius:18px;
}

/* =========================
   ADMIN
========================= */

.admin{
    display:none;
    background:#101218;
    border:1px solid var(--line);
    border-radius:20px;
    padding:25px;
    margin-bottom:45px;
}

.admin h2{
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    color:#8e94a0;
    font-size:12px;
    font-weight:700;
}

.field input,
.field textarea,
.field select{
    background:#090a0e;
    border:1px solid #2c3039;
    color:#fff;
    border-radius:10px;
    padding:12px;
    outline:none;
    font-family:inherit;
}

.field textarea{
    min-height:160px;
    resize:vertical;
}

.admin-actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:15px;
}

.btn{
    border:1px solid #343842;
    background:#1a1d24;
    color:#fff;
    border-radius:10px;
    padding:11px 15px;
    cursor:pointer;
}

.btn.primary{
    background:#fff;
    color:#08090c;
    border-color:#fff;
}

.btn.danger{
    color:#ff8c8c;
}

.status{
    margin-top:12px;
    color:#8e94a0;
    font-size:13px;
}

/* =========================
   LIGHTBOX
========================= */

.lightbox{
    position:fixed;
    inset:0;
    z-index:999;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.92);
    padding:30px;
}

.lightbox img{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
    border-radius:12px;
}

.lightbox-close{
    position:absolute;
    top:20px;
    right:25px;
    color:#fff;
    font-size:30px;
    cursor:pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){
    .article-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .featured{
        grid-template-columns:1fr;
    }

    .featured-image{
        min-height:300px;
    }
}

@media(max-width:700px){
    .header{
        padding:0 20px;
    }

    .nav button:not(.login-btn){
        display:none;
    }

    main{
        width:calc(100% - 30px);
        padding-top:30px;
    }

    .hero{
        min-height:430px;
        padding:45px 20px;
    }

    .hero h1{
        letter-spacing:-2px;
    }

    .tools{
        flex-direction:column;
    }

    .article-grid{
        grid-template-columns:1fr;
    }

    .featured-content{
        padding:25px;
    }

    .article-images{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">
        n:<span>spotlight</span>
    </a>

    <nav class="nav">
        <button class="active" onclick="showHome()">Spotlight</button>
        <button onclick="filterCategory('Creator')">Creator</button>
        <button onclick="filterCategory('YouTube')">YouTube</button>
        <button onclick="filterCategory('Streaming')">Streaming</button>
        <button onclick="filterCategory('TV & Medien')">TV & Medien</button>
        <button class="login-btn" onclick="toggleAdmin()">Redaktion</button>
    </nav>
</header>

<section class="hero" id="hero">
    <div class="hero-image" id="heroImage"></div>

    <div class="hero-content">
        <div class="kicker">n: spotlight</div>
        <h1>Creator. Medien. Trends.</h1>
        <p>
            Die Welt der Creator, Streaming, YouTube, Social Media
            und TV – kompakt, aktuell und im n:-Look.
        </p>
    </div>
</section>

<main>

    <!-- ADMIN -->
    <section class="admin" id="adminPanel">

        <h2>Spotlight-Redaktion</h2>

        <div class="form-grid">

            <div class="field full">
                <label>Titel</label>
                <input id="titleInput" type="text">
            </div>

            <div class="field">
                <label>Kategorie</label>
                <select id="categoryInput">
                    <option value="Creator">Creator</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Streaming">Streaming</option>
                    <option value="Social Media">Social Media</option>
                    <option value="TV & Medien">TV & Medien</option>
                </select>
            </div>

            <div class="field">
                <label>Bild-URL</label>
                <input id="imageInput" type="text">
            </div>

            <div class="field full">
                <label>Kurzbeschreibung</label>
                <textarea id="descriptionInput"></textarea>
            </div>

            <div class="field full">
                <label>Artikeltext</label>
                <textarea id="contentInput"></textarea>
            </div>

            <div class="field full">
                <label>Weitere Bild-URLs – eine pro Zeile</label>
                <textarea id="imagesInput"></textarea>
            </div>

            <div class="field full">
                <label>Video-URL (optional)</label>
                <input id="videoInput" type="text">
            </div>

        </div>

        <div class="admin-actions">
            <button class="btn primary" onclick="saveArticle()">Artikel speichern</button>
            <button class="btn" onclick="clearForm()">Formular leeren</button>
            <button class="btn" onclick="loadArticles()">Aktualisieren</button>
        </div>

        <div class="status" id="adminStatus"></div>

    </section>

    <!-- HOME -->
    <section id="homeView">

        <div class="section-head">
            <div>
                <h2>Aktuell im Spotlight</h2>
                <p>Creator, Streaming, Social Media und Medien</p>
            </div>
        </div>

        <div class="tools">
            <input
                class="search"
                id="searchInput"
                type="search"
                placeholder="Spotlight durchsuchen..."
                oninput="renderArticles()"
            >
        </div>

        <div class="categories">
            <button class="category active" onclick="filterCategory('Alle',this)">Alle</button>
            <button class="category" onclick="filterCategory('Creator',this)">Creator</button>
            <button class="category" onclick="filterCategory('YouTube',this)">YouTube</button>
            <button class="category" onclick="filterCategory('Streaming',this)">Streaming</button>
            <button class="category" onclick="filterCategory('Social Media',this)">Social Media</button>
            <button class="category" onclick="filterCategory('TV & Medien',this)">TV & Medien</button>
        </div>

        <div style="height:30px"></div>

        <div id="featuredContainer"></div>

        <div id="articleGrid" class="article-grid"></div>

    </section>

    <!-- ARTICLE -->
    <section id="articleView" class="article-view">

        <button class="back" onclick="showHome()">
            ← Zurück zu Spotlight
        </button>

        <div id="articleContainer"></div>

    </section>

</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-close">×</div>
    <img id="lightboxImage" src="" alt="">
</div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://eqzmsuncndfsiedyfifb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_eXY1gg_tIr-cRC2kdt0jbQ_QPfbEmkF";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const BUCKET = "news-images";

let articles = [];
let currentCategory = "Alle";
let editingId = null;


/* =========================================================
   LOAD
========================================================= */

async function loadArticles(){

    const { data, error } =
        await supabaseClient
        .from("spotlight_articles")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){
        console.error(error);
        document.getElementById("articleGrid").innerHTML =
            `<div class="empty">Die Spotlight-Artikel konnten nicht geladen werden.</div>`;
        return;
    }

    articles = data || [];

    renderArticles();
    renderHero();
}


/* =========================================================
   HERO
========================================================= */

function renderHero(){

    const latest = articles[0];

    if(!latest){
        return;
    }

    const heroImage =
        latest.image_url ||
        "";

    document.getElementById("heroImage").style.backgroundImage =
        heroImage
        ? `url("${heroImage}")`
        : "none";

}


/* =========================================================
   RENDER
========================================================= */

function renderArticles(){

    const grid =
        document.getElementById("articleGrid");

    const featured =
        document.getElementById("featuredContainer");

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let filtered = articles.filter(article => {

        const matchesCategory =
            currentCategory === "Alle" ||
            article.category === currentCategory;

        const searchable =
            `${article.title || ""} ${article.description || ""} ${article.content || ""} ${article.category || ""}`
            .toLowerCase();

        const matchesSearch =
            !search || searchable.includes(search);

        return matchesCategory && matchesSearch;
    });

    featured.innerHTML = "";

    if(filtered.length === 0){

        grid.innerHTML =
            `<div class="empty" style="grid-column:1/-1">
                Keine passenden Spotlight-Artikel gefunden.
             </div>`;

        return;
    }

    const first = filtered[0];

    featured.innerHTML = `
        <article class="featured"
                 onclick="openArticle(${first.id})">

            <div class="featured-image"
                 style="background-image:url('${escapeAttribute(first.image_url || "")}')">
            </div>

            <div class="featured-content">

                <div class="label">
                    ${escapeHtml(first.category || "Spotlight")}
                </div>

                <h2>
                    ${escapeHtml(first.title || "Ohne Titel")}
                </h2>

                <p>
                    ${escapeHtml(first.description || "")}
                </p>

            </div>

        </article>
    `;

    const rest = filtered.slice(1);

    grid.innerHTML = rest.map(article => `

        <article class="article-card"
                 onclick="openArticle(${article.id})">

            <div class="card-image"
                 style="background-image:url('${escapeAttribute(article.image_url || "")}')">
            </div>

            <div class="card-body">

                <div class="card-category">
                    ${escapeHtml(article.category || "Spotlight")}
                </div>

                <div class="card-title">
                    ${escapeHtml(article.title || "Ohne Titel")}
                </div>

                <div class="card-description">
                    ${escapeHtml(article.description || "")}
                </div>

            </div>

        </article>

    `).join("");
}


/* =========================================================
   CATEGORY
========================================================= */

function filterCategory(category,button){

    currentCategory = category;

    document
        .querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    if(button){
        button.classList.add("active");
    }

    renderArticles();

    window.scrollTo({
        top:document.querySelector("main").offsetTop - 80,
        behavior:"smooth"
    });
}


/* =========================================================
   HOME
========================================================= */

function showHome(){

    document.getElementById("homeView").style.display = "block";
    document.getElementById("articleView").style.display = "none";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   ARTICLE
========================================================= */

function openArticle(id){

    const article =
        articles.find(a => Number(a.id) === Number(id));

    if(!article){
        return;
    }

    document.getElementById("homeView").style.display = "none";
    document.getElementById("articleView").style.display = "block";

    const additionalImages =
        Array.isArray(article.image_urls)
        ? article.image_urls
        : [];

    let imagesHTML = "";

    if(additionalImages.length){

        imagesHTML = `
            <div class="article-images">

                ${additionalImages.map(url => `
                    <img
                        src="${escapeAttribute(url)}"
                        alt=""
                        onclick="event.stopPropagation();openLightbox('${escapeAttribute(url)}')"
                    >
                `).join("")}

            </div>
        `;
    }

    let videoHTML = "";

    if(article.video_url){

        const videoUrl = article.video_url;

        if(
            videoUrl.includes("youtube.com") ||
            videoUrl.includes("youtu.be")
        ){

            const embed =
                convertYoutubeUrl(videoUrl);

            if(embed){

                videoHTML = `
                    <iframe
                        class="article-video"
                        height="500"
                        src="${escapeAttribute(embed)}"
                        frameborder="0"
                        allowfullscreen>
                    </iframe>
                `;
            }

        }else{

            videoHTML = `
                <video
                    class="article-video"
                    controls
                    src="${escapeAttribute(videoUrl)}">
                </video>
            `;
        }
    }

    document.getElementById("articleContainer").innerHTML = `

        <div class="article-meta">
            ${escapeHtml(article.category || "Spotlight")}
        </div>

        <h1>
            ${escapeHtml(article.title || "Ohne Titel")}
        </h1>

        <div class="article-lead">
            ${escapeHtml(article.description || "")}
        </div>

        ${
            article.image_url
            ? `
            <img
                class="article-main-image"
                src="${escapeAttribute(article.image_url)}"
                alt=""
                onclick="openLightbox('${escapeAttribute(article.image_url)}')"
            >
            `
            : ""
        }

        <div class="article-content">
            ${escapeHtml(article.content || "")}
        </div>

        ${imagesHTML}

        ${videoHTML}

    `;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   YOUTUBE
========================================================= */

function convertYoutubeUrl(url){

    try{

        const parsed =
            new URL(url);

        let videoId = "";

        if(parsed.hostname.includes("youtu.be")){

            videoId =
                parsed.pathname.substring(1);

        }else{

            videoId =
                parsed.searchParams.get("v");
        }

        if(!videoId){
            return null;
        }

        return `https://www.youtube.com/embed/${videoId}`;

    }catch{
        return null;
    }
}


/* =========================================================
   ADMIN
========================================================= */

async function toggleAdmin(){

    const panel =
        document.getElementById("adminPanel");

    if(panel.style.display === "block"){

        panel.style.display = "none";
        return;
    }

    const {
        data:{
            session
        }
    } =
        await supabaseClient.auth.getSession();

    if(!session){

        const email =
            prompt("Redaktions-E-Mail:");

        if(!email){
            return;
        }

        const password =
            prompt("Passwort:");

        if(!password){
            return;
        }

        const {
            error
        } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

        if(error){

            alert(
                "Anmeldung fehlgeschlagen:\n" +
                error.message
            );

            return;
        }
    }

    panel.style.display = "block";

    panel.scrollIntoView({
        behavior:"smooth"
    });
}


/* =========================================================
   SAVE
========================================================= */

async function saveArticle(){

    const title =
        document.getElementById("titleInput").value.trim();

    if(!title){

        alert("Bitte einen Titel eingeben.");
        return;
    }

    const category =
        document.getElementById("categoryInput").value;

    const description =
        document.getElementById("descriptionInput").value.trim();

    const content =
        document.getElementById("contentInput").value.trim();

    const image_url =
        document.getElementById("imageInput").value.trim();

    const video_url =
        document.getElementById("videoInput").value.trim();

    const image_urls =
        document.getElementById("imagesInput")
        .value
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    const payload = {
        title,
        category,
        description,
        content,
        image_url,
        image_urls,
        video_url
    };

    let result;

    if(editingId){

        result =
            await supabaseClient
            .from("spotlight_articles")
            .update(payload)
            .eq("id",editingId);

    }else{

        result =
            await supabaseClient
            .from("spotlight_articles")
            .insert(payload);
    }

    if(result.error){

        console.error(result.error);

        document.getElementById("adminStatus").textContent =
            "Fehler: " + result.error.message;

        return;
    }

    document.getElementById("adminStatus").textContent =
        editingId
        ? "Artikel aktualisiert."
        : "Artikel veröffentlicht.";

    clearForm();
    await loadArticles();
}


/* =========================================================
   CLEAR
========================================================= */

function clearForm(){

    editingId = null;

    document.getElementById("titleInput").value = "";
    document.getElementById("descriptionInput").value = "";
    document.getElementById("contentInput").value = "";
    document.getElementById("imageInput").value = "";
    document.getElementById("imagesInput").value = "";
    document.getElementById("videoInput").value = "";
}


/* =========================================================
   EDIT
========================================================= */

function editArticle(id){

    const article =
        articles.find(a => Number(a.id) === Number(id));

    if(!article){
        return;
    }

    editingId = article.id;

    document.getElementById("titleInput").value =
        article.title || "";

    document.getElementById("categoryInput").value =
        article.category || "Creator";

    document.getElementById("descriptionInput").value =
        article.description || "";

    document.getElementById("contentInput").value =
        article.content || "";

    document.getElementById("imageInput").value =
        article.image_url || "";

    document.getElementById("videoInput").value =
        article.video_url || "";

    document.getElementById("imagesInput").value =
        Array.isArray(article.image_urls)
        ? article.image_urls.join("\n")
        : "";

    document.getElementById("adminPanel").style.display = "block";

    document.getElementById("adminPanel").scrollIntoView({
        behavior:"smooth"
    });
}


/* =========================================================
   DELETE
========================================================= */

async function deleteArticle(id){

    if(!confirm("Diesen Spotlight-Artikel wirklich löschen?")){
        return;
    }

    const {
        error
    } =
        await supabaseClient
        .from("spotlight_articles")
        .delete()
        .eq("id",id);

    if(error){

        alert(
            "Löschen fehlgeschlagen:\n" +
            error.message
        );

        return;
    }

    await loadArticles();
}


/* =========================================================
   DUPLICATE
========================================================= */

async function duplicateArticle(id){

    const article =
        articles.find(a => Number(a.id) === Number(id));

    if(!article){
        return;
    }

    const copy = {
        title: (article.title || "") + " – Kopie",
        description: article.description,
        category: article.category,
        content: article.content,
        image_url: article.image_url,
        image_urls: article.image_urls || [],
        video_url: article.video_url
    };

    const {
        error
    } =
        await supabaseClient
        .from("spotlight_articles")
        .insert(copy);

    if(error){

        alert(
            "Duplizieren fehlgeschlagen:\n" +
            error.message
        );

        return;
    }

    await loadArticles();
}

/* =========================================================
   ESCAPE HELPERS
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttribute(value){

    return escapeHtml(value);
}
